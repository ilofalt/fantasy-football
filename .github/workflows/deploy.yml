name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for OIDC federation to AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::522400670446:role/fantasy-football-deploy
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync out/ s3://ff-isaiahofalt-com-site --delete --exclude "data/*"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E11B9NOX7PQN0L --paths "/*"
